[project]
# The portal is deployed from the Dockerfile (python:3.14), CI tests 3.14 and
# 3.15, and psycopg2-binary only ships wheels for 3.14 from 2.9.13 on: keep
# local environments on the same floor.
name = "pyladiescon-portal"
version = "0"
requires-python = ">=3.14"

[tool.djlint]
# https://www.djlint.com/docs/linter/
# H030 - Consider adding a meta description.
# H031 - Consider adding meta keywords.
ignore="H030,H031"
profile = "django"
custom_blocks="switch"
line_break_after_multiline_tag=true
use_gitignore = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "portal.settings"
testpaths = [ "tests" ]
pythonpath = [ "." ]
markers = [
  "no_agreements: create accounts without the Code of Conduct and Terms of Service agreement, for tests of the gate that asks for them",
]

[tool.coverage.run]
omit = ["portal/settings.py"]
