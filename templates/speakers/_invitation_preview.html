{% load i18n %}
<div class="border rounded p-3 bg-light small">
    <div class="text-secondary mb-2">
        <div>
            <strong>{% trans "To:" %}</strong> {{ preview.recipient }}
        </div>
        <div>
            <strong>{% trans "Subject:" %}</strong> {{ preview.subject }}
        </div>
    </div>
    <div class="bg-white border rounded p-3">
        {{ preview.html|safe }}
    </div>
    <div class="form-text">
        <span class="invitation-preview-note px-1">{% trans "Highlighted" %}</span>
        {% trans "is your personal message; the rest is the template. The personal link and its expiry date are set when the email goes out." %}
    </div>
</div>
